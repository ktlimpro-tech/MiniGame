<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 MiniGame Hub - 초스피드 웹 파티/내기 게임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* 모바일 앱 터치감 최적화 */
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between antialiased select-none">

  <!-- 메인 모바일 컨테이너 (최대 480px) -->
  <main class="w-full max-w-md min-h-screen flex flex-col justify-between p-4 relative shadow-2xl bg-slate-900 border-x border-slate-800">

    <!-- 상단 헤더 -->
    <header class="flex items-center justify-between pb-3 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐊</span>
        <h1 class="text-lg font-black tracking-wider text-amber-400">MiniGame Hub</h1>
      </div>
      <div id="roomBadge" class="hidden px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-mono font-bold text-amber-300">
        방 코드: <span id="displayRoomCode">----</span>
      </div>
    </header>

    <!-- 1. 홈 화면 (방 생성 / 참가) -->
    <section id="viewHome" class="flex-1 flex flex-col justify-center gap-6 py-6">
      <div class="text-center space-y-2">
        <div class="text-5xl animate-bounce">🎯</div>
        <h2 class="text-2xl font-black text-slate-50">1초 만에 시작하는 술자리 내기</h2>
        <p class="text-sm text-slate-400">설치 없이 링크 하나로 친구들과 즉시 대결!</p>
      </div>

      <div class="space-y-4 bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">내 닉네임</label>
          <input type="text" id="inputNickname" maxlength="8" placeholder="예: 불사조, 김대리"
            class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 font-bold focus:outline-none focus:border-amber-400 text-base" />
        </div>

        <div class="pt-2 flex flex-col gap-3">
          <button id="btnCreateRoom" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg shadow-lg active:scale-95 transition">
            ✨ 새 게임 방 만들기
          </button>
          
          <div class="flex items-center gap-2">
            <input type="text" id="inputRoomCode" maxlength="4" placeholder="방 코드 4자리"
              class="flex-1 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-center font-mono font-bold tracking-widest text-slate-100 focus:outline-none focus:border-emerald-400 uppercase text-base" />
            <button id="btnJoinRoom" class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base active:scale-95 transition">
              참여하기
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 대기실 화면 (Lobby) -->
    <section id="viewLobby" class="hidden flex-1 flex flex-col justify-between py-4">
      <div class="space-y-4">
        <!-- 게임 종류 선택 카드 (방장 전용) -->
        <div class="p-4 rounded-2xl bg-slate-800/90 border border-slate-700 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-amber-400">🎮 플레이할 미니게임</span>
            <span id="roleNotice" class="text-[11px] text-slate-400">방장 설정 가능</span>
          </div>
          <select id="selectGameType" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 font-bold text-base focus:outline-none focus:border-amber-400">
            <option value="crocodile" selected>🐊 1호. 악어 이빨 복불복 (스피드 내기)</option>
            <option value="nunchi" disabled>⏱️ 2호. 1초 눈치 게임 (준비 중)</option>
            <option value="liar" disabled>🕵️ 3호. 모바일 라이어 게임 (준비 중)</option>
          </select>
        </div>

        <!-- 벌칙 설정 -->
        <div class="p-4 rounded-2xl bg-slate-800/90 border border-slate-700 space-y-2">
          <span class="text-xs font-bold text-rose-400">⚡ 걸린 사람 벌칙</span>
          <input type="text" id="inputPenalty" value="오늘 커피 쏘기! ☕" maxlength="20"
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 font-bold text-sm focus:outline-none focus:border-rose-400" />
        </div>

        <!-- 참여자 목록 (글씨 큼직) -->
        <div class="p-4 rounded-2xl bg-slate-800/90 border border-slate-700 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-300">👥 모인 친구들 (<span id="playerCount">1</span>명)</span>
            <button id="btnCopyInvite" class="px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-bold text-amber-300 transition">
              🔗 초대 링크 복사
            </button>
          </div>
          <div id="lobbyPlayerList" class="grid grid-cols-2 gap-2 text-sm">
            <!-- 참여자 카드 삽입 -->
          </div>
        </div>
      </div>

      <!-- 대기실 하단 버튼 -->
      <div class="pt-4 space-y-2">
        <button id="btnStartGame" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl shadow-xl active:scale-95 transition">
          🚀 게임 시작하기!
        </button>
        <button id="btnLeaveLobby" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 text-sm transition">
          나가기
        </button>
      </div>
    </section>

    <!-- 3. 인게임 화면: 1호 악어 이빨 (Crocodile Game) -->
    <section id="viewGame" class="hidden flex-1 flex flex-col justify-between py-2">
      <!-- 턴 알림 헤더 -->
      <div class="text-center p-3 rounded-2xl bg-slate-800 border border-slate-700">
        <div class="text-xs text-slate-400">현재 차례</div>
        <div id="currentTurnName" class="text-2xl font-black text-amber-400 animate-pulse">홍길동 차례!</div>
        <div class="text-xs text-rose-400 mt-1">⚠️ 꽝 이빨을 누르면 악어가 입을 쾅 닫습니다!</div>
      </div>

      <!-- 악어 이빨 그래픽 영역 -->
      <div class="flex-1 flex flex-col items-center justify-center my-4">
        <div class="relative w-full max-w-[320px] aspect-square flex flex-col items-center justify-center bg-slate-800/40 rounded-3xl border border-slate-700/60 p-4">
          <div class="text-6xl mb-4">🐊</div>
          <div id="teethGrid" class="grid grid-cols-4 gap-3 w-full">
            <!-- 12개 악어 이빨 버튼들 -->
          </div>
        </div>
      </div>

      <!-- 안전/조작 안내 -->
      <div class="text-center text-xs text-slate-500 pb-2">
        이빨을 터치하여 생존하세요. 누른 이빨은 안전하게 들어갑니다.
      </div>
    </section>

    <!-- 4. 최종 결과 화면 (Result) -->
    <section id="viewResult" class="hidden flex-1 flex flex-col justify-between py-6">
      <div class="text-center space-y-4 my-auto">
        <div class="text-6xl animate-bounce">💥</div>
        <h2 class="text-3xl font-black text-rose-500">악어에게 물렸습니다!</h2>
        <div class="p-5 rounded-2xl bg-rose-500/10 border border-rose-500/30">
          <div class="text-xs text-slate-400 mb-1">최종 당첨자 (벌칙)</div>
          <div id="resultLoserName" class="text-3xl font-black text-rose-400 mb-2">홍길동</div>
          <div id="resultPenaltyText" class="text-base font-bold text-slate-200">오늘 커피 쏘기! ☕</div>
        </div>
      </div>

      <!-- 결과 조작 버튼 -->
      <div class="space-y-3 pt-6">
        <button id="btnShareKakao" class="w-full py-4 rounded-xl bg-[#FEE500] hover:bg-[#FDD800] text-[#191919] font-black text-lg flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
          <span>💬</span> 카카오톡으로 결과 전송
        </button>
        <button id="btnPlayAgain" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base active:scale-95 transition">
          🔄 대기실로 돌아가 한 판 더!
        </button>
      </div>
    </section>

  </main>

  <script src="/js/socketManager.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
